; Firmware del ESP32-S3 principal del robot auxi.
; Bluepad32 necesita su propia plataforma (fork de Espressif con Arduino core 2.x).
; Verifica la URL vigente en https://bluepad32.readthedocs.io (seccion PlatformIO).

[env:esp32s3]
platform = https://github.com/ricardoquesada/platform-espressif32.git#bluepad32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3-DevKitC-1 N16R8: 16 MB flash, 8 MB PSRAM octal
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    adafruit/Adafruit VL53L0X

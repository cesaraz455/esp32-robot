; Firmware del ESP32-S3 principal del robot auxi.
; Bluepad32 no es una libreria normal: viene dentro de un Arduino-ESP32 modificado,
; por eso se reemplaza el framework con platform_packages (ver
; https://community.platformio.org/t/use-bluepad32-library-in-pio/46745).

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3-DevKitC-1 N16R8: 16 MB flash, 8 MB PSRAM octal
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    adafruit/Adafruit_VL53L0X

; Entorno de depuracion: redirige Serial al USB nativo del S3 (COM por el conector USB),
; para ver los prints sin adaptador UART. Compilar/subir con: pio run -e debug -t upload
[env:debug]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
